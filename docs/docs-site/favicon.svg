  <path d="M48 18 l8.6 17.4 19.2 2.8 -13.9 13.5 3.3 19.1 -17.2 -9 -17.2 9 3.3 -19.1 -13.9 -13.5 19.2 -2.8 Z" fill="none" stroke="#f5b301" stroke-width="5" stroke-linejoin="round"/>
