[package]
name = "jev-stars"
version = "0.2.0"
edition = "2021"
description = "Local-first GitHub stars memory for AI coding agents"
license = "MIT"
repository = "https://github.com/AkashPriyadarshii/jev-stars"
homepage = "https://github.com/AkashPriyadarshii/jev-stars"
keywords = ["github-stars", "mcp", "typesafe-ai", "sqlite", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "jev-stars"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries", "hf-hub"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
