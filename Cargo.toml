[package]
name = "jev-stars"
version = "0.1.0"
edition = "2021"
description = "Local-first GitHub stars memory for AI coding agents"
license = "MIT"

[[bin]]
name = "jev-stars"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2.12", features = ["json"] }
